[project]
name = "goit-python-web-hw-11"
version = "0.1.0"
description = "Contacts REST API with FastAPI, SQLAlchemy, Alembic, PostgreSQL"
authors = [
    { name = "Serg Kalynychenko", email = "kalinasergey911@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4"

dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "email-validator (>=2.1.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "bcrypt (<4.1)",
    "requests (>=2.34.2,<3.0.0)",
    "fastapi-mail (>=1.6.4,<2.0.0)",
    "cloudinary (>=1.44.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "fastapi-limiter==0.2.0",
    "fastapi-middleware (>=0.2.1,<0.3.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "sphinx (>=9.1.0,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
