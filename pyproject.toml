[project]
name = "goit-python-web-hw-11"
version = "0.1.0"
description = "Contacts REST API with FastAPI, SQLAlchemy, Alembic, PostgreSQL"
authors = [
    { name = "Serg Kalynychenko", email = "kalinasergey911@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "email-validator (>=2.1.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "bcrypt (<4.1)",
    "requests (>=2.34.2,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
